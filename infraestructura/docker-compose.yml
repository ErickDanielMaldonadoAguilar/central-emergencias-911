  mongodb:
    image: mongo:8.0.28
    container_name: central911-mongodb
    hostname: mongodb

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


volumes:
  kafka-1-data:
    name: central911-kafka-1-data

  kafka-2-data:
    name: central911-kafka-2-data

  kafka-3-data:
    name: central911-kafka-3-data

  mongo-data:
    name: central911-mongo-data